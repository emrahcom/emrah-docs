# Overrides for the opendesk-jitsi chart on the minikube VM. Only the values
# that differ from the chart defaults are listed here.
---
global:
  domain: "mydomain.corp"
  hosts:
    keycloak: "ucs-sso-ng"

patchJVB:
  configuration:
    staticLoadbalancerIP: "172.18.18.21"

jitsi:
  publicURL: "https://meet.minikube.loc"
  supportURL: "https://emrah.com"

  web:
    extraConfig:
      dialinPhoneNumbers: "+49 1111 2223344"
    ingress:
      enabled: true
      hosts:
        - host: "meet.minikube.loc"
          paths:
            - "/"

  prosody:
    extraEnvs:
      AUTH_TYPE: "hybrid_matrix_token"
      JWT_APP_ID: "meet.mydomain.corp"
      JWT_APP_SECRET: "myappsecret"
      MATRIX_UVS_URL: "https://matrix.mav.dev.souvap.cloud"
      MATRIX_UVS_SYNC_POWER_LEVELS: "true"

  jicofo:
    extraEnvs:
      MAX_BRIDGE_PARTICIPANTS: "3"

  jvb:
    portRangeSize: 3
    service:
      type: "NodePort"

  jibri:
    enabled: true

  jigasi:
    enabled: true
    extraEnvs:
      JIGASI_SIP_URI: "jigasi.test@1.2.3.4"
      JIGASI_SIP_PASSWORD: "mypassword"
      JIGASI_SIP_SERVER: "1.2.3.4"
      JIGASI_SIP_PORT: "5060"
      JIGASI_SIP_TRANSPORT: "TCP"

settings:
  keycloakRealm: "ucs"
  jwtAppSecret:
    value: "myappsecret"
  allowUnsecureCert: "true"
...
