#publicURL: ""
publicURL: "https://meet.minikube.loc"

#turnHost: ""
turnHost: "turn.minikube.loc"

websockets:
  colibri:
    enabled: false
  xmpp:
    #enabled: false
    enabled: true

## #############################################################################
## Web configuration
## #############################################################################
web:
  ingress:
    #enabled: false
    enabled: true

    #annotations: {}
    annotations:
      cert-manager.io/cluster-issuer: "selfsigned-issuer"

    hosts:
      - host: "meet.minikube.loc"
        paths:
          - "/"

    #tls: []
    tls:
      - secretName: "jitsi-web-tls"
        hosts:
          - "meet.minikube.loc"

## #############################################################################
## JVB configuration
## #############################################################################
jvb:
  replicaCount: 1

  publicIPs:
    - 172.18.18.21

  #useHostPort: false
  useHostPort: true
  UDPPort: 10000

  portRangeSize: 1

  service:
    #enabled: true
    enabled: false

octo:
  enabled: false
