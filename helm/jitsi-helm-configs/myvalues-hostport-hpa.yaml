#publicURL: ""
publicURL: "https://meet.minikube.loc"

#turnHost: ""
turnHost: "turn.minikube.loc"

websockets:
  xmpp:
    #enabled: false
    enabled: true

## #############################################################################
## Web configuration
## #############################################################################
web:
  ingress:
    #enabled: false
    enabled: true

    #annotations: {}
    annotations:
      cert-manager.io/cluster-issuer: "selfsigned-issuer"

    hosts:
      - host: "meet.minikube.loc"
        paths:
          - "/"

    #tls: []
    tls:
      - secretName: "jitsi-web-tls"
        hosts:
          - "meet.minikube.loc"

## #############################################################################
## JVB configuration
## #############################################################################
jvb:
  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: AverageValue
            averageValue: 100m

    behavior:
      scaleDown:
        stabilizationWindowSeconds: 30
        policies:
          - type: Pods
            value: 1
            periodSeconds: 10


  publicIPs:
    - 172.18.18.21

  #useHostPort: false
  useHostPort: true
  UDPPort: 10000

  portRangeSize: 1

  service:
    #enabled: true
    enabled: false

octo:
  enabled: false
